<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area {
            font: normal 20pt Arial;
            background-color: green;
            color: white;
            width: 300px;
            height: 300px;
            line-height: 300px;
            text-align: center;
        }
        body {
            background-color: black;
        }
    </style>
</head>
<body>
    <div id="area" onmouseenter="entrar()" onmouseout="sair()" onclick="clicar()">
        Intereja...
    </div>
    <script>
        var area = window.document.getElementById('area')
        area.addEventListener('click', clicar)
        area.addEventListener('mouseenter', entrar)
        area.addEventListener('mouseout', sair)

        function clicar() {
                area.innerText = 'Você quer casar comigo?????'
                area.style.background = 'red'

        }

        function entrar() {
            area.innerText = 'I Love You!'
            area.style.background = 'purple'
        }

        function sair() {
            area.innerText = 'Volta pra mim..'
            area.style.background = 'black'
        }
    </script>
</body>
</html>
