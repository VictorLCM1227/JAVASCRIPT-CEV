<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfândega</title>
</head>
<body>
    <h1>Sistema de nacionalidade</h1>
    Onde você nasceu: <input type="text" name="pais" id="pais">
    <input type="button" value="verificar" onclick="analisar()">
    <div id="res">

    </div>
    <script>
        function analisar() {
            var pais = document.getElementById('pais').value
            var res = document.querySelector('div#res')
            res.innerHTML = `<p>Você nasceu no país ${pais} então: </P>`
            if (pais == 'Brasil') {
                res.innerHTML += `<p>Você é brasileiro!</p>`
            } else {
                res.innerHTML += `<p> Você é estrangeiro!</p>`
            }
        }
    </script>
</body>
</html>
